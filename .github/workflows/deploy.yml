# Continuous deployment: after CI passes on main, deploy the new images to
# the production host over SSH and run the stack's migration (the API applies
# SQLx migrations automatically at startup, so "deploy" = rebuild + restart).
#
# Required repository secrets:
#   DEPLOY_HOST       — public hostname or IP of the production VPS
#   DEPLOY_USER       — SSH user with key-based auth to that host
#   DEPLOY_SSH_KEY    — private key (PEM) allowed to log in as DEPLOY_USER
#   DEPLOY_PATH       — absolute path of the checkout on the host (e.g. /srv/securevault)
#
# Until those secrets are configured this workflow is inert (the job skips),
# so merging it does not break CI. See docs/deployment.md.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Skip unless deploy secrets are configured
        id: guard
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets not set — skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.guard.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
            docker image prune -f
            # Post-deploy verification: fail the job (and alert the operator)
            # if either service is unhealthy after the restart.
            sleep 15
            curl -fsS http://localhost/ready >/dev/null 2>&1 || docker compose -f docker-compose.prod.yml ps
