[package]
name = "secure-vault-api"
version.workspace = true
edition.workspace = true

[lib]
name = "secure_vault_api"
path = "src/lib.rs"

[[bin]]
name = "secure-vault"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
axum-extra = { workspace = true }
async-trait = "0.1"
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
secure-vault-config = { workspace = true }
secure-vault-models = { workspace = true }
secure-vault-database = { workspace = true }
secure-vault-crypto = { workspace = true }
secure-vault-auth = { workspace = true }
secure-vault-vault = { workspace = true }
secure-vault-audit = { workspace = true }
secure-vault-webauthn = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
