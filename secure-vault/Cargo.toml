[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/auth",
    "crates/crypto",
    "crates/vault",
    "crates/database",
    "crates/models",
    "crates/webauthn",
    "crates/audit",
    "crates/config",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }

secure-vault-config = { path = "crates/config" }
secure-vault-models = { path = "crates/models" }
secure-vault-database = { path = "crates/database" }
secure-vault-crypto = { path = "crates/crypto" }
secure-vault-auth = { path = "crates/auth" }
secure-vault-vault = { path = "crates/vault" }
secure-vault-audit = { path = "crates/audit" }
secure-vault-webauthn = { path = "crates/webauthn" }

[profile.release]
lto = true
codegen-units = 1
strip = true
